<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim Formu</title>
    <!-- Font Awesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contact-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .contact-card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            height: 100px;
        }
        .submit-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #1ebe57;
        }
        .submit-btn i {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h2>Bize Ulaşın</h2>
        
        <!-- İletişim Formu Başlangıcı -->
        <form action="https://api.web3forms.com/submit" method="POST">
            
            <!-- AŞAĞIDAKİ Tırnak İçine Web3Forms'dan Aldığınız Anahtarınızı (Access Key) Yazın -->
            <input type="hidden" name="apikey" value="BURAYA_API_ANAHTARINIZI_YAZIN">

            <div class="form-group">
                <label for="name">Adınız Soyadınız:</label>
                <input type="text" id="name" name="name" required placeholder="Adınızı girin">
            </div>

            <div class="form-group">
                <label for="email">E-posta Adresiniz:</label>
                <input type="email" id="email" name="email" required placeholder="muminsultani@hotmail.com">
            </div>

            <div class="form-group">
                <label for="message">Mesajınız:</label>
                <textarea id="message" name="message" required placeholder="Mesajınızı buraya yazın..."></textarea>
            </div>

            <!-- Spam Koruması -->
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i> Mesajı Gönder
            </button>

        </form>
    </div>

</body>
</html>
